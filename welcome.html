<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>وجهتك الأكاديمية</title>
  <link rel="stylesheet" href="welcome.css">
</head>
<body>

  <div class="card">
    <header class="header">
      <div class="logo-icon">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="12" stroke="#FFF4E0" stroke-width="2"/>
          <path d="M50 20 L60 38 L40 38 Z" fill="none" stroke="#FFF4E0" stroke-width="2"/>
          <path d="M50 80 L60 62 L40 62 Z" fill="none" stroke="#FFF4E0" stroke-width="2"/>
          <path d="M20 50 L38 40 L38 60 Z" fill="none" stroke="#FFF4E0" stroke-width="2"/>
          <path d="M80 50 L62 40 L62 60 Z" fill="none" stroke="#FFF4E0" stroke-width="2"/>
        </svg>
      </div>
      <p class="subtitle">جامعة حمص • 15–17 أيلول</p>
    </header>

    <main class="content">
      <h1 class="title">وجهتك الأكاديمية</h1>
      <span class="badge">النسخة الثانية</span>

      <p class="description">
        ثلاثة أيام تتعرّف فيها على كل كلية في الجامعة، وتسأل من درسها قبلك.
      </p>

      <div class="info-card">
        <h3>سجّل من البيت، واخل من الخط السريع</h3>
        <p>التسجيل شرط الدخول. بتاخد بطاقة برمز QR خاص فيك، وبتربطك بكل نشاط تحضره.</p>
      </div>

      <div class="actions">
        <button class="btn btn-primary">سجّل الآن • دقيقتين &larr;</button>
        <button class="btn btn-secondary">عندي بطاقة من قبل</button>
      </div>
    </main>
  </div>

</body>
</html>
