<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دليل التخصص — وجهتك الأكاديمية ٢</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FFF4E0; --teal:#0C4A43; --red:#C41415; --orange:#E75503;
  --ink:#0C4A43; --mute:#6E6858; --faint:#A39A88; --line:#E6DAC0; --white:#fff; --paper:#FFFBF3;
  --cluster:#0C4A43; --measure:70ch; --tap:44px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--cream);font-family:'IBM Plex Sans Arabic','Noto Kufi Arabic','Segoe UI',system-ui,sans-serif;
  color:var(--ink);font-size:16px;line-height:1.7}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2.5px solid var(--orange);outline-offset:3px;border-radius:4px}

/* ===== شريط تقدّم القراءة ===== */
.progress{position:fixed;inset-block-start:0;inset-inline:0;height:3px;z-index:50;background:transparent}
.progress i{display:block;height:100%;width:0;background:var(--cluster);transform-origin:right center;transition:width .12s linear}

/* ===== شاشة اختيار التخصص ===== */
.pick{padding:26px 20px 80px;max-width:1180px;margin-inline:auto}
.pick-h{margin-block-end:20px}
.pick-h .kick{font-size:.8rem;font-weight:600;color:var(--orange);letter-spacing:.06em;margin:0 0 6px}
.pick-h h1{margin:0 0 8px;font-size:clamp(1.7rem,5vw,2.5rem);font-weight:700;line-height:1.2}
.pick-h p{margin:0;color:var(--mute);max-width:58ch;line-height:1.75}
.pick-search{margin-block:18px 20px;position:relative}
.pick-search input{
  width:100%;min-height:52px;border:1.5px solid var(--line);border-radius:12px;background:var(--white);
  padding-inline:16px;font:inherit;color:var(--ink);
}
.pick-search input:focus{border-color:var(--cluster);outline:none}
.pick-grid{display:grid;gap:12px;grid-template-columns:1fr}
.pick-c{margin-block-start:22px}
.pick-c h2{font-size:.86rem;font-weight:600;margin:0 0 10px;color:var(--cc);display:flex;align-items:center;gap:8px}
.pick-c h2::before{content:"";width:10px;height:10px;background:var(--cc);transform:rotate(45deg);flex:none}
.card{
  display:grid;grid-template-columns:104px 1fr;gap:14px;align-items:center;text-align:start;
  width:100%;min-height:84px;padding:12px 14px;background:var(--white);
  border:1px solid var(--line);border-radius:14px;transition:transform .22s cubic-bezier(.25,.8,.3,1),box-shadow .22s ease,border-color .2s;
}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(12,74,67,.10);border-color:var(--cc)}
.card .mk{width:104px;height:56px;color:var(--cc);opacity:.92}
.card:hover .mk{opacity:1}
.card .mk svg{width:100%;height:100%;display:block}
.card .nm{font-weight:600;font-size:1.02rem;line-height:1.35}
.card .mt{font-size:.78rem;color:var(--mute);margin-block-start:3px;font-variant-numeric:tabular-nums}
.pick-empty{padding:30px 4px;color:var(--mute)}

/* ===== الإطار ===== */
.mg{max-width:1440px;margin-inline:auto;padding-inline:20px;padding-block:0 96px}
.back{display:inline-flex;align-items:center;gap:7px;min-height:var(--tap);color:var(--mute);font-size:.9rem;font-weight:500}
.back:hover{color:var(--cluster)}

/* ===== المشهد الرئيسي (الرسمة البطل) ===== */
.hero{position:relative;overflow:hidden;border-block-end:1px solid var(--line);padding-block:10px 18px}
.hero-art{position:relative;height:clamp(150px,30vw,230px);margin-inline:-20px;color:var(--cluster)}
.hero-art .lat{position:absolute;inset:0;opacity:.13;color:var(--cluster)}
.hero-art .lat svg,.hero-art .scene{width:100%;height:100%;display:block}
.hero-art .scene{position:absolute;inset:0}
.hero-art .scene svg{width:100%;height:100%;display:block;overflow:visible}
.draw path,.draw line,.draw circle,.draw rect,.draw polyline,.draw polygon,.draw ellipse{
  stroke-dasharray:var(--len,600);stroke-dashoffset:var(--len,600);
  animation:draw 1.1s cubic-bezier(.3,.7,.3,1) forwards;animation-delay:calc(var(--d,0)*70ms);
}
.draw [data-fill]{opacity:0;animation:fadeIn .5s ease forwards;animation-delay:calc(var(--d,0)*70ms + 400ms)}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadeIn{to{opacity:1}}
.hero-top{position:relative;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-block-end:4px}
.hero-cluster{margin:0;font-size:.8rem;font-weight:600;letter-spacing:.06em;color:var(--cluster)}
.hero-up{margin:0;font-size:.75rem;color:var(--faint);font-variant-numeric:tabular-nums}
.mg-name{margin:0;font-size:clamp(1.7rem,5.2vw,2.9rem);font-weight:700;line-height:1.2;text-wrap:balance;position:relative}

/* ===== بطاقة التعريف ===== */
.mg-id{margin-block:14px 0;border:1px solid var(--line);background:var(--paper);border-radius:12px;overflow:hidden}
.mg-id dl{margin:0;display:grid;grid-template-columns:1fr 1fr}
.mg-id .row{padding:9px 11px;border-block-end:1px solid var(--line);min-height:var(--tap)}
.mg-id .row:nth-child(odd){border-inline-end:1px solid var(--line)}
.mg-id .row:nth-last-child(-n+2){border-block-end:0}
.mg-id dt{font-size:.7rem;color:var(--mute);margin:0 0 2px;font-weight:500}
.mg-id dd{margin:0;font-size:.86rem;font-weight:600;line-height:1.5}
.mg-id dd .n{font-variant-numeric:tabular-nums}

/* ===== الخلاصة والمدخل ===== */
.mg-lead{margin:14px 0 0;font-size:clamp(1rem,2.6vw,1.22rem);line-height:1.8;max-width:62ch;color:#1C4B45}
.mg-lead.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.mg-more{min-height:36px;font-size:.86rem;font-weight:600;color:var(--orange)}
.mg-more[hidden]{display:none}
.mg-enter{margin-block-start:12px;width:100%;min-height:56px;display:flex;align-items:center;justify-content:space-between;
  gap:14px;padding-inline:18px;border:1.5px solid var(--cluster);border-radius:12px;background:var(--white);font-weight:600}
.mg-enter .c{font-size:.82rem;color:var(--mute);font-weight:500;font-variant-numeric:tabular-nums}
.mg-enter:hover{background:var(--paper)}

/* ===== الجسم ===== */
.mg-body{margin-block-start:34px;display:grid;gap:28px;grid-template-columns:minmax(0,1fr)}
.mg-axes{min-width:0}
.mg-index{display:none}
.mg-index h2{font-size:.8rem;color:var(--mute);margin:0 0 10px;font-weight:600}
.mg-index ol{list-style:none;margin:0;padding:0}
.mg-index a{display:grid;grid-template-columns:2.1rem 1fr;gap:8px;align-items:baseline;padding-block:7px;
  color:var(--mute);text-decoration:none;font-size:.86rem;line-height:1.45;
  border-inline-start:2px solid transparent;padding-inline-start:10px;transition:color .2s,border-color .2s}
.mg-index a .num{font-variant-numeric:tabular-nums;font-size:.76rem;color:var(--faint)}
.mg-index a:hover{color:var(--ink)}
.mg-index a[aria-current="true"]{color:var(--cluster);font-weight:600;border-inline-start-color:var(--cluster)}
.mg-index .alias{font-size:.72rem;color:var(--faint)}

.mg-intro{border-inline-start:2px solid var(--cluster);padding-inline-start:16px;margin-block-end:26px;max-width:var(--measure)}
.mg-intro h2{margin:0 0 6px;font-size:1rem;font-weight:600;color:var(--cluster)}
.mg-intro p{margin:0;color:#2A4E49;line-height:1.85}

/* ===== المحاور ===== */
.ax{border-block-start:1px solid var(--line)}
.ax:last-of-type{border-block-end:1px solid var(--line)}
.ax-h{width:100%;min-height:var(--tap);display:grid;grid-template-columns:2rem 1fr 1.4rem;align-items:center;
  gap:10px;padding-block:16px;text-align:start}
.ax-h .num{font-variant-numeric:tabular-nums;font-size:.86rem;color:var(--faint);font-weight:600;white-space:nowrap}
.ax-h .t{font-size:1.04rem;font-weight:600;line-height:1.45;text-wrap:balance}
.ax-h .chev{justify-self:center;color:var(--faint);font-size:.9rem;line-height:1;transition:transform .26s ease,color .2s}
.ax-h[aria-expanded="true"] .chev{transform:rotate(180deg);color:var(--cluster)}
.ax-h[aria-expanded="true"] .num{color:var(--cluster)}
.ax-h:hover .t{color:var(--cluster)}
.ax-b{padding-block:0 24px;max-width:var(--measure)}
.ax-b[hidden]{display:none}
.ax-b.anim>*{animation:rise .42s cubic-bezier(.25,.8,.3,1) backwards;animation-delay:calc(var(--i,0)*60ms + 40ms)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ax-b p{margin:0 0 14px;line-height:1.85}
.ax-b p:last-child{margin-block-end:0}
.ax-b ul{margin:0 0 16px;padding-inline-start:0;list-style:none}
.ax-b ul li{position:relative;padding-inline-start:18px;margin-block-end:9px;line-height:1.8}
.ax-b ul li::before{content:"";position:absolute;inset-inline-start:2px;inset-block-start:.72em;width:6px;height:6px;
  background:var(--cluster);opacity:.55;transform:rotate(45deg)}
.note{margin:0 0 16px;padding:14px 16px;background:var(--white);border:1px solid var(--line);
  border-inline-start:3px solid var(--cluster);border-radius:10px}
.note p{margin:0 0 8px;font-size:.95rem;line-height:1.75;color:#2A4E49}
.note p:last-child{margin:0}

/* ===== الرسوم التوضيحية ===== */
.dg{margin:2px 0 20px;border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:16px 14px 12px;overflow:hidden}
.dg-t{font-size:.74rem;font-weight:600;color:var(--mute);margin:0 0 10px;letter-spacing:.03em}
.dg svg{width:100%;height:auto;display:block;overflow:visible;color:var(--cluster)}
.dg text{font-family:inherit;fill:var(--ink)}
.dg .lb{font-size:11px;font-weight:600}
.dg .lb-s{font-size:9.5px;fill:var(--mute)}
.dg .fill-c{fill:var(--cluster)}
.dg .st-c{stroke:var(--cluster);fill:none;stroke-width:1.6}
.dg .st-l{stroke:var(--line);fill:none;stroke-width:1.2}

/* الجداول */
.tw{overflow-x:auto;margin-block-end:18px;border:1px solid var(--line);border-radius:10px;background:var(--white)}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:.9rem}
thead th{position:sticky;inset-block-start:0;background:var(--cluster);color:var(--cream);text-align:start;
  padding:10px 12px;font-weight:600;white-space:nowrap}
tbody td{padding:10px 12px;border-block-start:1px solid var(--line);vertical-align:top;line-height:1.6}

/* رقاقة المصدر */
.cite{position:relative;display:inline-block;min-width:20px;padding:0 5px;margin-inline:2px;font-size:.72rem;
  font-weight:600;font-variant-numeric:tabular-nums;color:var(--cluster);background:rgba(12,74,67,.08);
  border-radius:5px;vertical-align:2px;line-height:1.6}
.cite::after{content:"";position:absolute;inset:-12px -8px}
.cite:hover{background:rgba(12,74,67,.16)}

/* 19 — بطاقات تنقلب */
.mis{display:grid;gap:14px}
.flip{perspective:1000px;display:block;width:100%;text-align:start;padding:0}
.flip-in{display:block;position:relative;width:100%;min-height:150px;transition:transform .5s cubic-bezier(.3,.8,.3,1);transform-style:preserve-3d}
.flip[aria-pressed="true"] .flip-in{transform:rotateY(180deg)}
.flip-f,.flip-b{position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--line);border-radius:12px;
  padding:16px 18px;display:flex;flex-direction:column;justify-content:center;gap:8px;background:var(--white);text-align:start}
.flip-f .tag{font-size:.7rem;font-weight:600;color:var(--faint);letter-spacing:.04em}
.flip-f .w{font-weight:600;color:var(--red);line-height:1.6}
.flip-f .hint{font-size:.74rem;color:var(--faint);margin-block-start:2px}
.flip-b{transform:rotateY(180deg);background:var(--cluster);color:var(--cream);border-color:var(--cluster)}
.flip-b .tag{font-size:.7rem;font-weight:600;opacity:.75;letter-spacing:.04em}
.flip-b .r{line-height:1.75;font-size:.94rem}

/* 17 — المؤشرات */
.fit-i{display:grid;gap:10px;margin-block:6px 18px}
.fit-r{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding-block:10px;border-block-end:1px solid var(--line)}
.fit-r p{margin:0;line-height:1.65;font-size:.97rem}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--white);flex:none}
.seg button{min-height:var(--tap);min-width:56px;padding-inline:12px;font-size:.84rem;color:var(--mute);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--cluster);color:var(--cream);font-weight:600}
.fit-read{padding:14px 16px;border:1px dashed var(--cluster);border-radius:10px;background:var(--paper)}
.fit-read b{display:block;font-size:1.02rem;margin-block-end:6px}
.fit-read span{font-size:.88rem;color:var(--mute);line-height:1.7}
.fit-dots{display:flex;gap:5px;margin-block:8px 4px;flex-wrap:wrap}
.fit-dots i{width:13px;height:13px;transform:rotate(45deg);background:var(--line);display:block;transition:background .3s ease,transform .3s ease}
.fit-dots i.on{background:var(--cluster);transform:rotate(45deg) scale(1.15)}
.fit-note{font-size:.8rem;color:var(--faint);margin-block-start:10px}

/* 15+16 — الميزان */
.bal-tabs{display:flex;gap:8px;margin-block-end:14px}
.bal-tabs button{min-height:var(--tap);padding-inline:16px;border:1px solid var(--line);border-radius:9px;
  background:var(--white);font-size:.92rem;color:var(--mute);flex:1;transition:background .2s,color .2s}
.bal-tabs button[aria-selected="true"]{background:var(--cluster);color:var(--cream);border-color:var(--cluster);font-weight:600}
.bal-cols{display:grid;gap:22px;grid-template-columns:1fr}
.bal-col h3{margin:0 0 10px;font-size:.92rem;font-weight:600;color:var(--cluster)}
.bal-col.neg h3{color:var(--red)}
.bal-col.neg ul li::before{background:var(--red)}
.bal-col[hidden]{display:none}

/* شريط سفلي + ورقة */
.mg-bar{position:fixed;inset-block-end:0;inset-inline:0;z-index:30;display:flex;background:var(--white);
  border-block-start:1px solid var(--line);padding-block:6px;padding-inline:8px;gap:8px;
  padding-block-end:max(6px,env(safe-area-inset-bottom))}
.mg-bar button{flex:1;min-height:var(--tap);border-radius:10px;font-size:.9rem;font-weight:600;color:var(--ink);
  background:var(--paper);border:1px solid var(--line)}
.sheet-bd{position:fixed;inset:0;z-index:40;background:rgba(12,74,67,.42);opacity:0;transition:opacity 300ms ease}
.sheet-bd.on{opacity:1}
.sheet{position:fixed;inset-inline:0;inset-block-end:0;z-index:41;background:var(--cream);
  border-start-start-radius:18px;border-start-end-radius:18px;max-height:82vh;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform 300ms cubic-bezier(.25,.8,.3,1);box-shadow:0 -18px 50px rgba(12,74,67,.22)}
.sheet.on{transform:translateY(0)}
.sheet[hidden],.sheet-bd[hidden]{display:none}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-block-end:1px solid var(--line)}
.sheet-h h2{margin:0;font-size:1rem;font-weight:600}
.sheet-x{min-width:var(--tap);min-height:var(--tap);border-radius:10px;font-size:1.1rem;color:var(--mute)}
.sheet-c{overflow-y:auto;padding:14px 18px 26px}
.src{display:grid;grid-template-columns:2.2rem 1fr;gap:10px;padding-block:11px;border-block-end:1px solid var(--line);font-size:.9rem;line-height:1.65}
.src:last-child{border-block-end:0}
.src .n{font-variant-numeric:tabular-nums;font-weight:600;color:var(--cluster);font-size:.82rem}
.src.hl{background:rgba(182,123,20,.10);border-radius:8px;padding-inline:8px}
.src a{color:var(--orange);text-underline-offset:3px;word-break:break-word}
.src .nolink{color:var(--faint);font-size:.78rem}
.sheet-c .idx{list-style:none;margin:0;padding:0}
.sheet-c .idx a{display:grid;grid-template-columns:2.2rem 1fr;gap:10px;min-height:var(--tap);align-items:center;
  padding-block:6px;color:var(--ink);text-decoration:none;font-size:.92rem}
.sheet-c .idx .num{font-variant-numeric:tabular-nums;color:var(--faint);font-size:.8rem}

/* الحالات */
.st{padding-block:40px;max-width:52ch}
.st h2{margin:0 0 8px;font-size:1.15rem;font-weight:600}
.st p{margin:0 0 18px;color:var(--mute);line-height:1.75}
.st button{min-height:var(--tap);padding-inline:20px;border-radius:10px;background:var(--teal);color:var(--cream);font-weight:600}
.sk{background:linear-gradient(90deg,#EFE6D2,#F7EFDD,#EFE6D2);border-radius:8px;height:14px;margin-block-end:10px}
.sk.t{height:34px;width:62%;margin-block-end:18px}
.sk.b{height:150px;width:100%;margin-block-end:14px}
.sk.s{width:88%} .sk.s2{width:74%}

/* مشهد الانتقال بين الشاشتين */
.screen{animation:none}
.screen.in{animation:scIn .42s cubic-bezier(.25,.85,.3,1)}
.screen.out{animation:scOut .26s ease forwards}
@keyframes scIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
@keyframes scOut{to{opacity:0;transform:translateY(-10px) scale(.99)}}

@media (min-width:768px){
  .mg,.pick{padding-inline:32px}
  .mg-id .row{padding:13px 16px}
  .mg-id dt{font-size:.76rem}
  .mg-id dd{font-size:.96rem}
  .mg-id dl{grid-template-columns:1fr 1fr}
  .pick-grid{grid-template-columns:1fr 1fr}
  .bal-tabs{display:none}
  .bal-cols{grid-template-columns:1fr 1fr;gap:28px}
  .bal-col[hidden]{display:block}
  .mg-bar{display:none}
  .mg{padding-block-end:56px}
  .mis{grid-template-columns:1fr 1fr}
  .sheet{inset-inline:auto 50%;transform:translate(50%,100%);width:min(560px,92vw);border-radius:18px;inset-block-end:24px}
  .sheet.on{transform:translate(50%,0)}
  .hero-art{margin-inline:-32px}
}
@media (min-width:1280px){
  .mg-id dl{grid-template-columns:repeat(3,1fr)}
  .mg-id .row:nth-child(odd){border-inline-end:0}
  .mg-id .row:not(:nth-child(3n)){border-inline-end:1px solid var(--line)}
  .mg-id .row:nth-last-child(-n+3){border-block-end:0}
  .mg-body{grid-template-columns:minmax(0,1fr) 260px;gap:44px}
  .mg-index{display:block;position:sticky;inset-block-start:24px;align-self:start;max-height:calc(100vh - 48px);overflow-y:auto}
  .mg-axes{max-width:var(--measure)}
  .pick-grid{grid-template-columns:repeat(3,1fr)}
  .mis{grid-template-columns:repeat(3,1fr)}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
  .draw path,.draw line,.draw circle,.draw rect,.draw polyline,.draw polygon,.draw ellipse{stroke-dashoffset:0 !important}
  .draw [data-fill]{opacity:1 !important}
}
</style>
</head>
<body>
<div class="progress" aria-hidden="true"><i></i></div>
<div id="major-guide"></div>
<script>
/* ===================== النظام البصري =====================
   moti: نقشة التجمّعات · heroes: مشهد لكل تخصص · diagrams: رسم لكل محور
   كلها SVG داخلي بلا صور ولا مكتبات، ويأخذ لونه من currentColor.
   ========================================================= */
const VIS = (() => {
  const MARKS = {
    arts:'M12 2 L22 12 L12 22 L2 12 Z M12 6.5 L17.5 12 L12 17.5 L6.5 12 Z',
    sciences:'M12 2 L20.6 7 V17 L12 22 L3.4 17 V7 Z M12 9.5 A2.5 2.5 0 1 1 11.99 9.5 Z',
    medicine:'M12 2 A5 5 0 0 1 17 7 A5 5 0 0 1 22 12 A5 5 0 0 1 17 17 A5 5 0 0 1 12 22 A5 5 0 0 1 7 17 A5 5 0 0 1 2 12 A5 5 0 0 1 7 7 A5 5 0 0 1 12 2 Z',
    civil:'M12 2.5 L21.5 19 H2.5 Z M6.5 14.5 H17.5 M12 8 V19',
    architecture:'M12 1.6 L15 8.8 L22.4 12 L15 15.2 L12 22.4 L9 15.2 L1.6 12 L9 8.8 Z',
    mechanical:'M12 3.2 L15.4 5.2 L19.2 4.9 L19 8.7 L21.6 11.5 L19 14.3 L19.2 18.1 L15.4 17.8 L12 19.8 L8.6 17.8 L4.8 18.1 L5 14.3 L2.4 11.5 L5 8.7 L4.8 4.9 L8.6 5.2 Z',
    agriculture:'M12 2 L18 12 L12 22 L6 12 Z M12 5.5 V19 M12 10 L16.4 7.6 M12 14 L7.6 11.6'
  };
  const lattice = (key, id) => {
    const d = MARKS[key] || MARKS.sciences;

      g('M96 96 C 112 72 132 108 150 84 C 168 60 182 96 200 76', 3, 1.6) +

  };
  const hero = key => `<svg viewBox="0 0 400 200" class="draw" aria-hidden="true" preserveAspectRatio="xMidYMid meet">${(HEROES[key] || HEROES.arch)()}</svg>`;

  /* ---------- الرسوم التوضيحية للمحاور ---------- */
  const esc = s => String(s == null ? '' : s).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
  const wrap = (title, svg) => `<figure class="dg"><figcaption class="dg-t">${esc(title)}</figcaption>${svg}</figure>`;

  // 2 — خريطة التقاطعات
  const dgMap = (ax, name) => {
    const it = listOf(ax).slice(0, 6); if (it.length < 3) return '';
    const cx = 200, cy = 112, n = it.length;
    const nodes = it.map((t, i) => {
      const a = -Math.PI / 2 + (i / n) * Math.PI * 2;
      return { x: cx + 116 * Math.cos(a), y: cy + 74 * Math.sin(a), t: short(t, 15), a };
    });
    return wrap('المجالات التي يتقاطع معها التخصص',
      `<svg viewBox="0 0 400 236">${nodes.map(p => `<line x1="${cx}" y1="${cy}" x2="${p.x.toFixed(0)}" y2="${p.y.toFixed(0)}" class="st-l"/>`).join('') +
      nodes.map(p => {
        const below = p.y > cy + 4, side = Math.abs(p.y - cy) < 26;
        const ty = below ? p.y + 20 : (side ? p.y + 5 : p.y - 14);
        const anchor = side ? (p.x > cx ? 'start' : 'end') : 'middle';
        const tx = side ? (p.x > cx ? p.x + 12 : p.x - 12) : p.x;
        return `<circle cx="${p.x.toFixed(0)}" cy="${p.y.toFixed(0)}" r="5.5" class="fill-c"/>` +
               `<text class="lb-s" x="${tx.toFixed(0)}" y="${ty.toFixed(0)}" text-anchor="${anchor}">${esc(p.t)}</text>`;
      }).join('') +
      `<circle cx="${cx}" cy="${cy}" r="40" class="st-c" fill="var(--paper)"/>` +
      `<text class="lb" x="${cx}" y="${cy + 4}" text-anchor="middle">${esc(short(name, 13))}</text>`}</svg>`);
  };
  // 5 — الشريط الزمني للسنوات
  const dgYears = ax => {
    const tb = tableOf(ax); if (!tb) return '';
    const rows = tb.rows.filter(r => r.length >= 2).slice(0, 6); if (rows.length < 2) return '';
    const W = 400, x0 = 34, x1 = 366, step = (x1 - x0) / (rows.length - 1);
    return wrap('مسار السنوات كما في الخطة المنشورة',
      `<svg viewBox="0 0 ${W} 132"><line x1="${x0}" y1="52" x2="${x1}" y2="52" class="st-c"/>` +
      rows.map((r, i) => { const x = (x0 + i * step).toFixed(0);
        return `<circle cx="${x}" cy="52" r="7" class="fill-c"/><text class="lb" x="${x}" y="34" text-anchor="middle">${esc(short(r[0], 10))}</text>` +
               `<text class="lb-s" x="${x}" y="76" text-anchor="middle">${esc(short(r[1], 14))}</text>`; }).join('') + `</svg>`);
  };
  // 7 — حلقة التفكير
  const dgCycle = () => wrap('كيف يشتغل التفكير في هذا التخصص',
    `<svg viewBox="0 0 400 190">${[['يفهم المشكلة',80,58],['يقترح حلاً',300,58],['يختبر وينتقد',300,140],['يعدّل ويعيد',80,140]]
      .map(([t, x, y]) => `<rect x="${x - 62}" y="${y - 22}" width="124" height="44" rx="10" class="st-c"/><text class="lb" x="${x}" y="${y + 4}" text-anchor="middle">${t}</text>`).join('')}
      <path d="M238 58 H262" class="st-c"/><path d="M254 52 L262 58 L254 64" class="st-c"/>
      <path d="M300 80 V118" class="st-c"/><path d="M294 110 L300 118 L306 110" class="st-c"/>
      <path d="M238 140 H162" class="st-c"/><path d="M170 134 L162 140 L170 146" class="st-c"/>
      <path d="M80 118 V80" class="st-c"/><path d="M74 88 L80 80 L86 88" class="st-c"/></svg>`);
  // 8 — الطبقات الثلاث
  const dgLayers = ax => {
    const ps = (ax.blocks || []).filter(b => b.type === 'p' && /^(المعارف|المهارات|الكفاءات)\s*:?$/.test(b.text.trim().replace(':', '')));
    if (ps.length < 2) return '';
    const names = ['المعارف', 'المهارات', 'الكفاءات'];
    const counts = names.map(n => { const i = (ax.blocks || []).findIndex(b => b.type === 'p' && b.text.replace(':', '').trim() === n);
      const nx = i >= 0 ? (ax.blocks || [])[i + 1] : null; return nx && nx.type === 'list' ? nx.items.length : 0; });
    return wrap('ثلاث طبقات يبنيها التخصص فوق بعضها',
      `<svg viewBox="0 0 400 170">${names.map((n, i) => {
        const r = 76 - i * 22, y = 84;
        return `<circle cx="200" cy="${y}" r="${r}" class="st-c" opacity="${1 - i * .18}"/>` +
          `<text class="lb" x="200" y="${y - r + 18}" text-anchor="middle">${n}${counts[i] ? ' · ' + counts[i] : ''}</text>`;
      }).join('')}</svg>`);
  };
  // 12 — عالمي / محلي
  const dgTwo = ax => {
    const bs = ax.blocks || [];
    const i1 = bs.findIndex(b => b.type === 'p' && /الصورة العالمية/.test(b.text));
    const i2 = bs.findIndex(b => b.type === 'p' && /(السياق السوري|السياق المحلي)/.test(b.text));
    if (i1 < 0 || i2 < 0) return '';
    return wrap('قراءتان للسوق: العالمية والمحلية',
      `<svg viewBox="0 0 400 128">
        <rect x="16" y="16" width="176" height="96" rx="12" class="st-c"/>

        <text class="lb" x="296" y="48" text-anchor="middle">السياق السوري</text>
        <text class="lb-s" x="296" y="72" text-anchor="middle">هو ما يقرّر فرصتك</text>
        <path d="M192 64 H208" class="st-c"/></svg>`);
  };
  // 13 — شجرة المسارات
  const dgTree = ax => {
    const it = listOf(ax).slice(0, 5); if (it.length < 3) return '';
    const y0 = 24, step = 30;
    return wrap('المسارات المتفرّعة بعد التخرج',
      `<svg viewBox="0 0 400 ${y0 + it.length * step + 18}">
        <path d="M370 ${y0 + 8} V ${y0 + (it.length - 1) * step + 8}" class="st-c"/>
        ${it.map((t, i) => { const y = y0 + i * step + 8;
          return `<path d="M370 ${y} H 336" class="st-c"/><circle cx="336" cy="${y}" r="4.5" class="fill-c"/>` +
                 `<text class="lb" x="322" y="${y + 4}" text-anchor="end">${esc(short(t, 42))}</text>`; }).join('')}
      </svg>`);
  };
  // 15+16 — الميزان
  const dgBalance = (a15, a16) => {
    const p = listOf(a15).length, n = listOf(a16).length; if (!p || !n) return '';
    const tilt = Math.max(-9, Math.min(9, (p - n) * 2.2));
    return wrap('ما يعطيه التخصص وما يطلبه — بالعدد لا بالحكم',
      `<svg viewBox="0 0 400 150">
        <path d="M200 128 V44" class="st-c"/><path d="M164 128 H236" class="st-c"/>
        <g transform="rotate(${tilt} 200 44)">
          <path d="M92 44 H308" class="st-c"/>
          <path d="M92 44 V64 M308 44 V64" class="st-c"/>
          <path d="M56 64 H128 L112 94 H72 Z" class="st-c"/>
          <path d="M272 64 H344 L328 94 H288 Z" class="st-c" stroke-dasharray="5 4"/>
          <text class="lb" x="92" y="84" text-anchor="middle">${p}</text>
          <text class="lb" x="308" y="84" text-anchor="middle">${n}</text>
        </g>
        <text class="lb-s" x="92" y="140" text-anchor="middle">مميزات</text>
        <text class="lb-s" x="308" y="140" text-anchor="middle">تحديات</text></svg>`);
  };
  // 20 — شبكة الأثر
  const dgNet = (ax, name) => {
    const it = listOf(ax).slice(0, 5);
    const src = it.length >= 3 ? it.map(t => short(t, 14)) : null; if (!src) return '';
    const pts = src.map((t, i) => { const a = -Math.PI / 2 + (i / src.length) * Math.PI * 2;
      return { x: 200 + 118 * Math.cos(a), y: 100 + 66 * Math.sin(a), t }; });
    return wrap('أين يظهر أثر التخصص',
      `<svg viewBox="0 0 400 200">
        ${pts.map((a, i) => pts.slice(i + 1).map(b => `<line x1="${a.x.toFixed(0)}" y1="${a.y.toFixed(0)}" x2="${b.x.toFixed(0)}" y2="${b.y.toFixed(0)}" class="st-l"/>`).join('')).join('')}
        ${pts.map(p => `<circle cx="${p.x.toFixed(0)}" cy="${p.y.toFixed(0)}" r="6" class="fill-c"/><text class="lb-s" x="${p.x.toFixed(0)}" y="${(p.y + (p.y < 100 ? -12 : 18)).toFixed(0)}" text-anchor="middle">${esc(p.t)}</text>`).join('')}
      </svg>`);
  };

  const diagram = (ax, data, a16) => {
    try {
      switch (ax.n) {
        case 2:  return dgMap(ax, data.name);
        case 5:  return dgYears(ax);
        case 7:  return dgCycle();
        case 8:  return dgLayers(ax);
        case 12: return dgTwo(ax);
        case 13: return dgTree(ax);
        case 15: return a16 ? dgBalance(ax, a16) : '';
        case 20: return dgNet(ax, data.name);
        default: return '';
      }
    } catch (e) { return ''; }
  };

  return { lattice, mark, hero, diagram };
})();

  const el = (h) => { const d = document.createElement('div'); d.innerHTML = h; return d.firstElementChild; };

  const CARD_LABELS = { degree:'الدرجة', years:'مدة الخطة', faculty:'الكلية', study_nature:'طبيعة الدراسة',
                        field:'المجال', isced:'التصنيف الدولي (ISCED)', admission_note:'شرط القبول' };
  const CARD_ORDER = ['degree','years','faculty','study_nature','field','isced','admission_note'];

  /* طول المسارات ليُرسم أمام العين */
  function measure(scope) {
    scope.querySelectorAll('.draw path,.draw line,.draw circle,.draw rect,.draw polyline,.draw polygon,.draw ellipse')
      .forEach(n => { let L = 400; try { L = n.getTotalLength ? n.getTotalLength() : 400; } catch (e) {}
        n.style.setProperty('--len', Math.max(24, Math.round(L))); });
  }

  /* ================= شاشة اختيار التخصص ================= */
  function picker(rootEl, index, onPick) {
    const root = typeof rootEl === 'string' ? document.querySelector(rootEl) : rootEl;
    if (!root) return;
    const groups = {};
    index.forEach(m => { const k = m.cluster.key; (groups[k] = groups[k] || { c: m.cluster, items: [] }).items.push(m); });
    root.innerHTML = `<div class="pick screen in">
      <header class="pick-h">
        <p class="kick">وجهتك الأكاديمية ٢ · دليل التخصص</p>
        <h1>أيّ تخصص تريد أن تفهمه من الداخل؟</h1>
        <p>واحد وعشرون دليلاً، كلٌّ منها في عشرين محوراً: من طبيعة الدراسة إلى سوق العمل والتصورات الخاطئة.</p>
      </header>
      <div class="pick-search"><input type="search" placeholder="ابحث باسم التخصص أو الكلية…" aria-label="بحث" data-q></div>
      <div data-groups>${Object.values(groups).map(g => `
        <section class="pick-c" style="--cc:${g.c.color}">
          <h2>${esc(g.c.name)}</h2>
          <div class="pick-grid">${g.items.map(m => `
            <button type="button" class="card" data-slug="${esc(m.slug)}" style="--cc:${m.cluster.color}">
              <span class="mk">${VIS.hero(m.hero || m.cluster.key)}</span>
              <span><span class="nm">${esc(m.name)}</span>
                <span class="mt">${m.years ? m.years + ' سنوات · ' : ''}${esc((m.faculty || '').replace(' - جامعة حمص', ''))}</span></span>
            </button>`).join('')}</div>
        </section>`).join('')}</div>
      <p class="pick-empty" data-empty hidden>لا تخصص بهذا الاسم. جرّب كلمة أقصر.</p>
    </div>`;

    const q = root.querySelector('[data-q]');
    q.addEventListener('input', () => {
      const v = q.value.trim();
      let n = 0;
      root.querySelectorAll('.card').forEach(c => {
        const ok = !v || c.textContent.includes(v);
        c.style.display = ok ? '' : 'none'; if (ok) n++;
      });
      root.querySelectorAll('.pick-c').forEach(s => {
        s.hidden = ![...s.querySelectorAll('.card')].some(c => c.style.display !== 'none');
      });
      root.querySelector('[data-empty]').hidden = n > 0;
    });
    root.addEventListener('click', e => {
      const c = e.target.closest('[data-slug]');
      if (c && onPick) onPick(c.dataset.slug, c);
    });
  }

  /* ================= بناء نافذة التخصص ================= */
  function build(root, data, opts) {
    opts = opts || {};
    const axes = (data.axes || []).filter(a => a && has(a.blocks));
    const byN = {}; axes.forEach(a => byN[a.n] = a);
    const merged = !!(byN[15] && byN[16]);
    const shown = axes.filter(a => !(merged && a.n === 16));
    const uid = 'mg-' + (data.slug || 'x');
    const sources = has(data.sources) ? data.sources : [];
    const card = data.card || {};
    const rows = CARD_ORDER.filter(k => card[k] != null && card[k] !== '').slice(0, 6);

    const body = a => {
      if (merged && a.n === 15) return balance(byN[15], byN[16]);
      if (a.n === 19) return misconceptions(a);
      if (a.n === 17) return fit(a);
      return VIS.diagram(a, data, byN[16]) + blocks(a.blocks);
    };

    root.innerHTML = `<div class="mg screen in">
      ${opts.onBack ? '<button type="button" class="back" data-back>◀ كل التخصصات</button>' : ''}
      <header class="hero">
        <div class="hero-art">
          <div class="lat">${VIS.lattice(data.cluster && data.cluster.key, uid + '-lat')}</div>
          <div class="scene">${VIS.hero(data.hero || (data.cluster && data.cluster.key))}</div>
        </div>
        <div class="hero-top">
          ${data.cluster ? `<p class="hero-cluster">تجمّع ${esc(data.cluster.name)}</p>` : ''}
          ${data.updated ? `<p class="hero-up">تحديث الملف ${esc(data.updated)}</p>` : ''}
        </div>
        <h1 class="mg-name">${esc(data.name)}</h1>
      </header>

      <section class="mg-id" aria-label="بطاقة تعريف سريعة"><dl>
        ${rows.map(k => `<div class="row"><dt>${CARD_LABELS[k]}</dt><dd>${
          k === 'years' ? `<span class="n">${esc(card[k])}</span> سنوات` : cites(card[k])}</dd></div>`).join('')}
      </dl></section>

      ${data.summary ? `<p class="mg-lead clamp" data-lead>${cites(data.summary)}</p>
        <button type="button" class="mg-more" data-more hidden>المزيد من الخلاصة</button>` : ''}

      <button type="button" class="mg-enter" data-enter>
        <span>المحاور العشرون</span>
        <span class="c">${(data.axes || []).length} محوراً · اضغط للانتقال</span></button>

      <div class="mg-body">
        <div class="mg-axes">
          ${data.intro ? `<section class="mg-intro"><h2>قبل أن تبدأ</h2><p>${cites(data.intro)}</p></section>` : ''}
          ${shown.map(a => {
            const isBal = merged && a.n === 15;
            const title = isBal ? a.title + ' وتحدياته' : a.title;
            const open = a.n === 19;
            return `<article class="ax" id="ax-${a.n}">
              <h2 style="margin:0"><button type="button" class="ax-h" aria-expanded="${open}" aria-controls="axb-${a.n}" data-ax="${a.n}">
                <span class="num">${a.n}</span><span class="t">${esc(title)}</span><span class="chev" aria-hidden="true">▾</span>
              </button></h2>
              <div class="ax-b" id="axb-${a.n}"${open ? '' : ' hidden'}>${body(a)}</div></article>`;
          }).join('')}
        </div>
        <nav class="mg-index" aria-label="فهرس المحاور"><h2>المحاور · 20</h2><ol>
          ${axes.map(a => { const t = (merged && a.n === 16) ? 15 : a.n;
            return `<li><a href="#ax-${t}" data-jump="${t}"><span class="num">${a.n}</span><span>${esc(a.title)}${
              (merged && a.n === 16) ? '<br><span class="alias">يظهر مع المحور 15</span>' : ''}</span></a></li>`; }).join('')}
        </ol></nav>
      </div>
    </div>
    <div class="mg-bar" role="toolbar" aria-label="تنقّل سريع">
      ${opts.onBack ? '<button type="button" data-back>التخصصات</button>' : ''}
      <button type="button" data-sheet="index">المحاور</button>
      ${sources.length ? '<button type="button" data-sheet="sources">المصادر</button>' : ''}
    </div>
    <div class="sheet-bd" data-bd hidden></div>
    <div class="sheet" data-sheet-el role="dialog" aria-modal="true" aria-labelledby="${uid}-sh" hidden>
      <div class="sheet-h"><h2 id="${uid}-sh"></h2><button type="button" class="sheet-x" data-close aria-label="إغلاق">✕</button></div>
      <div class="sheet-c"></div></div>`;

    wire(root, data, { axes, merged, sources, onBack: opts.onBack });
  }

  /* ---------- كتل المحتوى ---------- */
  function blocks(bs) {
    let h = '', i = 0;
    (bs || []).forEach(b => {
      if (!b || !b.type) return;
      const s = ` style="--i:${i++}"`;
      if (b.type === 'p' && b.text) h += `<p${s}>${cites(b.text)}</p>`;
      else if (b.type === 'note' && b.text)
        h += `<div class="note"${s}>${b.text.split('\n').filter(Boolean).map(t => `<p>${cites(t)}</p>`).join('')}</div>`;
      else if (b.type === 'list' && has(b.items)) h += `<ul${s}>${b.items.map(x => `<li>${cites(x)}</li>`).join('')}</ul>`;
      else if (b.type === 'table' && has(b.rows))
        h += `<div class="tw"${s}><table><thead><tr>${(b.head || []).map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead>` +
             `<tbody>${b.rows.map(r => `<tr>${r.map(c => `<td>${cites(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    });
    return h;
  }

  /* ---------- 19 — بطاقات تنقلب ---------- */
  function misconceptions(ax) {
    const COMBO = /^[«"“](.+?)[»"”]\s*[:：—–\-]?\s*(?:و?الأدقّ?|الصواب|الحقيقة)\s*[:：]?\s*([\s\S]+)$/;
    const QUOTE = /^(?:التصور|الاعتقاد|يُقال|يقال)\s*[:：]\s*([\s\S]+?)\s*$|^[«"“](.+?)[»"”]\s*[.。:：]?\s*$/;
    const CORR  = /^\s*(?:و?الأدقّ?|الصواب|الحقيقة)\s*[:：]\s*([\s\S]+)$/;
    const cand = [], rest = [];
    (ax.blocks || []).forEach(b => {
      if (b.type === 'p' || b.type === 'note') String(b.text).split('\n').forEach(t => t.trim() && cand.push(t.trim()));
      else if (b.type === 'list') (b.items || []).forEach(t => cand.push(t));
      else if (b.type === 'table') [b.head].concat(b.rows || []).forEach(r => (r || []).forEach(t => t && t.trim() && cand.push(t.trim())));
      else rest.push(b);
    });
    const pairs = []; let pend = null, plain = [];
    cand.forEach(t => {
      let m = COMBO.exec(t);
      if (m) { pairs.push({ w: m[1].trim(), r: m[2].trim() }); pend = null; return; }
      const q = QUOTE.exec(t);
      if (q) { pend = (q[1] || q[2] || '').trim(); return; }
      const c2 = CORR.exec(t);
      if (c2 && pend) { pairs.push({ w: pend, r: c2[1].trim() }); pend = null; return; }
      plain.push(t);
    });
    if (!pairs.length) return blocks(ax.blocks);
    const lead = plain.length ? `<p style="--i:0">${cites(plain[0])}</p>` : '';
    const tail = plain.slice(1).map((t, i) => `<p style="--i:${i + 1}">${cites(t)}</p>`).join('');
    return lead + `<div class="mis">${pairs.map((p, i) => `
      <button type="button" class="flip" aria-pressed="false" style="--i:${i}">
        <span class="flip-in">
          <span class="flip-f"><span class="tag">تصوّر شائع</span><span class="w">«${esc(p.w)}»</span><span class="hint">اضغط لترى الأدقّ</span></span>
          <span class="flip-b"><span class="tag">الأدقّ</span><span class="r">${cites(p.r)}</span></span>
        </span></button>`).join('')}</div>` + tail;
  }

  /* ---------- 17 — مؤشرات الملاءمة ---------- */
  function fit(ax) {
    const lb = (ax.blocks || []).find(b => b.type === 'list' && has(b.items));
    if (!lb) return blocks(ax.blocks);
    const before = [], after = []; let seen = false;
    (ax.blocks || []).forEach(b => { if (b === lb) { seen = true; return; } (seen ? after : before).push(b); });
    return blocks(before) +
      `<div class="fit-i" data-fit-total="${lb.items.length}">${lb.items.map((t, i) => `
        <div class="fit-r"><p>${cites(t)}</p>
          <div class="seg" role="group" aria-label="المؤشر ${i + 1}">
            <button type="button" data-fit="${i}" data-v="1" aria-pressed="false">ينطبق</button>
            <button type="button" data-fit="${i}" data-v="0" aria-pressed="false">لا</button>
          </div></div>`).join('')}</div>
      <div class="fit-read" data-fit-read hidden></div>
      <p class="fit-note">إجاباتك تبقى على جهازك في هذه الجلسة فقط، ولا تُرسل ولا تُحفظ.</p>` + blocks(after);
  }

  /* ---------- 15+16 — الميزان ---------- */
  function balance(a15, a16) {
    const col = (ax, cls, id) => ax ? `<div class="bal-col ${cls}" id="${id}" role="tabpanel"><h3>${esc(ax.title)}</h3>${blocks(ax.blocks)}</div>` : '';
    return (VIS.diagram(a15, {}, a16) || '') +
      `<div class="bal-tabs" role="tablist">
        <button type="button" role="tab" aria-selected="true" aria-controls="bal-pos" data-bal="pos">${esc(a15.title)}</button>
        <button type="button" role="tab" aria-selected="false" aria-controls="bal-neg" data-bal="neg">${esc(a16.title)}</button>
      </div><div class="bal-cols">${col(a15, 'pos', 'bal-pos')}${col(a16, 'neg', 'bal-neg')}</div>`;
  }

  /* ================= السلوك ================= */
  function wire(root, data, ctx) {
    const $ = s => root.querySelector(s);
    const sheet = $('[data-sheet-el]'), bd = $('[data-bd]');
    const sheetT = sheet.querySelector('h2'), sheetC = sheet.querySelector('.sheet-c');
    let lastFocus = null;
    root.style.setProperty('--cluster', (data.cluster && data.cluster.color) || '#0C4A43');
    measure(root);

    // الرسوم تُرسم عند ظهورها
    const io = 'IntersectionObserver' in window ? new IntersectionObserver(es => {
      es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('draw'); measure(e.target); io.unobserve(e.target); } });
    }, { threshold: .25 }) : null;
    const armDiagrams = scope => scope.querySelectorAll('.dg svg:not(.draw)').forEach(s => {
      if (reduced() || !io) { s.classList.add('draw'); measure(s); } else io.observe(s);
    });
    // ارتفاع بطاقة التصوّر = أطول وجهيها، حتى لا يُقصّ نص
    const sizeFlips = scope => (scope || root).querySelectorAll('.flip-in').forEach(w => {
      w.style.minHeight = '';
      const h = [...w.children].reduce((m, f) => Math.max(m, f.scrollHeight), 0);
      if (h) w.style.minHeight = (h + 4) + 'px';
    });
    armDiagrams(root); sizeFlips();
    addEventListener('resize', () => sizeFlips(), { passive: true });

    function toggle(n, force) {
      const btn = root.querySelector(`[data-ax="${n}"]`), b = root.querySelector('#axb-' + n);
      if (!btn || !b) return;
      const open = force !== undefined ? force : btn.getAttribute('aria-expanded') !== 'true';
      btn.setAttribute('aria-expanded', String(open));
      if (open) {
        b.hidden = false;
        b.classList.remove('anim'); void b.offsetWidth; b.classList.add('anim');
        armDiagrams(b); sizeFlips(b); mark(n);
      } else b.hidden = true;
    }
    function mark(n) {
      root.querySelectorAll('.mg-index a').forEach(a => a.setAttribute('aria-current', String(a.dataset.jump === String(n))));
    }
    const go = elm => elm && elm.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'start' });

    root.addEventListener('click', e => {
      const ax = e.target.closest('[data-ax]'); if (ax) return toggle(+ax.dataset.ax);
      const jump = e.target.closest('[data-jump]');
      if (jump) { e.preventDefault(); const n = +jump.dataset.jump; toggle(n, true); closeSheet(); go(root.querySelector('#ax-' + n)); return; }
      if (e.target.closest('[data-enter]')) return go(root.querySelector('.ax'));
      const c = e.target.closest('.cite'); if (c) return openSources(+c.dataset.src);
      const sh = e.target.closest('[data-sheet]'); if (sh) return sh.dataset.sheet === 'sources' ? openSources() : openIndex();
      if (e.target.closest('[data-close]') || e.target === bd) return closeSheet();
      if (e.target.closest('[data-back]') && ctx.onBack) return ctx.onBack();
      const fl = e.target.closest('.flip');
      if (fl) { fl.setAttribute('aria-pressed', String(fl.getAttribute('aria-pressed') !== 'true')); return; }
      const bal = e.target.closest('[data-bal]');
      if (bal) {
        const pos = bal.dataset.bal === 'pos';
        root.querySelectorAll('[data-bal]').forEach(b => b.setAttribute('aria-selected', String(b === bal)));
        const p = root.querySelector('#bal-pos'), n = root.querySelector('#bal-neg');
        if (p && n && matchMedia('(max-width:767px)').matches) { p.hidden = !pos; n.hidden = pos; }
        return;
      }
      const f = e.target.closest('[data-fit]');
      if (f) { f.closest('.seg').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === f))); readFit(); }
    });

    function readFit() {
      const box = root.querySelector('.fit-i'); if (!box) return;
      const out = root.querySelector('[data-fit-read]');
      const total = +box.dataset.fitTotal;
      const answered = box.querySelectorAll('.seg button[aria-pressed="true"]').length;
      const yes = box.querySelectorAll('.seg button[aria-pressed="true"][data-v="1"]').length;
      if (!answered) { out.hidden = true; return; }
      out.hidden = false;
      out.innerHTML = `<b>${arw(yes)} من ${arw(total)} من المؤشرات تنطبق عليك.</b>
        <span class="fit-dots" aria-hidden="true">${Array.from({length: total}, (_, i) => `<i class="${i < yes ? 'on' : ''}"></i>`).join('')}</span>
        <span>هذه قراءة للتأمل لا حكم بقبول أو رفض. المؤشرات تصف انسجاماً محتملاً مع طبيعة الدراسة، والقرار يبقى لك بعد زيارة الكورنر والاستشارة الفردية.</span>`;
    }

    function openSheet(title, html) {
      lastFocus = document.activeElement;
      sheetT.textContent = title; sheetC.innerHTML = html;
      bd.hidden = false; sheet.hidden = false; void sheet.offsetWidth;
      bd.classList.add('on'); sheet.classList.add('on');
      const f = sheet.querySelector('.sheet-x'); if (f) f.focus();
    }
    function closeSheet() {
      if (sheet.hidden) return;
      bd.classList.remove('on'); sheet.classList.remove('on');
      const done = () => { sheet.hidden = true; bd.hidden = true; };
      reduced() ? done() : setTimeout(done, 300);
      if (lastFocus && lastFocus.focus) lastFocus.focus();
    }
    function openSources(hl) {
      if (!ctx.sources.length) return;
      openSheet('المصادر', ctx.sources.map(s => `<div class="src${hl === s.n ? ' hl' : ''}">
        <span class="n">${esc(s.n)}</span><span>${esc(s.text)}${
        s.url ? `<br><a href="${esc(s.url)}" target="_blank" rel="noopener">رابط المصدر</a>` : '<br><span class="nolink">بلا رابط إلكتروني</span>'}</span></div>`).join(''));
      if (hl) { const e2 = sheetC.querySelector('.hl'); if (e2) e2.scrollIntoView({ block: 'nearest' }); }
    }
    function openIndex() {
      openSheet('المحاور', `<ol class="idx">${ctx.axes.map(a => { const t = (ctx.merged && a.n === 16) ? 15 : a.n;
        return `<li><a href="#ax-${t}" data-jump="${t}"><span class="num">${a.n}</span><span>${esc(a.title)}</span></a></li>`; }).join('')}</ol>`);
    }

    const lead = $('[data-lead]'), more = $('[data-more]');
    if (lead && more) {
      if (lead.scrollHeight > lead.clientHeight + 2) more.hidden = false;
      more.addEventListener('click', () => { more.textContent = lead.classList.toggle('clamp') ? 'المزيد من الخلاصة' : 'إخفاء'; });
    }
    root.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
    mark(19);

    // شريط تقدّم القراءة + انزياح خفيف للنقشة
    const bar = document.querySelector('.progress i'), lat = $('.hero-art .lat');
    const onScroll = () => {
      const h = document.documentElement.scrollHeight - innerHeight;
      if (bar) bar.style.width = (h > 0 ? Math.min(100, scrollY / h * 100) : 0) + '%';
      if (lat && !reduced()) lat.style.transform = `translateY(${Math.min(40, scrollY * .12)}px)`;
    };
    removeEventListener('scroll', global.__mgScroll || (() => {}));
    global.__mgScroll = onScroll; addEventListener('scroll', onScroll, { passive: true }); onScroll();
  }

  /* ================= الحالات ================= */
  const SKELETON = `<div class="mg"><div class="st" aria-busy="true" aria-live="polite">
    <div class="sk b"></div><div class="sk t"></div><div class="sk"></div><div class="sk s"></div><div class="sk s2"></div>
    <span style="position:absolute;inset-inline-start:-9999px">يجري تحميل دليل التخصص…</span></div></div>`;

  function errorView(root, msg, retry) {
    root.innerHTML = `<div class="mg"><div class="st"><h2>تعذّر تحميل الدليل</h2>
      <p>${esc(msg)}<br>تحقّق من اتصالك ثم أعد المحاولة. ويمكنك في هذه الأثناء سؤال ممثل التخصص في الكورنر مباشرة.</p>
      <button type="button" data-retry>إعادة المحاولة</button></div></div>`;
    const b = root.querySelector('[data-retry]'); if (b) b.addEventListener('click', retry);
  }

  function mountMajorGuide(rootEl, data, opts) {
    const root = typeof rootEl === 'string' ? document.querySelector(rootEl) : rootEl;
    if (!root) return;
    if (!data) { root.innerHTML = SKELETON; return; }
    if (!data.name || !has(data.axes)) {
      root.innerHTML = `<div class="mg"><div class="st"><h2>لا يوجد محتوى لهذا التخصص بعد</h2>
        <p>الدليل قيد الإعداد. اسأل ممثل التخصص في الكورنر، أو عد لاحقاً.</p></div></div>`;
      return;
    }
    build(root, data, opts);
  }
  mountMajorGuide.picker = picker;
  mountMajorGuide.load = function (rootEl, slug, opts) {
    const root = typeof rootEl === 'string' ? document.querySelector(rootEl) : rootEl;
    if (!root) return;
    mountMajorGuide(root, null);
    fetch(API_BASE + '/majors/' + encodeURIComponent(slug), { headers: { Accept: 'application/json' } })
      .then(r => { if (!r.ok) throw new Error('الخادم أعاد الحالة ' + r.status); return r.json(); })
      .then(d => mountMajorGuide(root, d, opts))
      .catch(e => errorView(root, /^الخادم/.test(e && e.message || '') ? e.message : 'لم يصل ردّ من الخادم.',
        () => mountMajorGuide.load(root, slug, opts)));
  };

لأعمال، ومعلومات خاصة بكلية الاقتصاد في جامعة حمص، وصورة واقع","summary":"في البداية: ستتعلم لغة الاقتصاد والأعمال: اقتصاد، إدارة، محاسبة، تسويق، رياضيات وحاسوب. ثم: ستضيف الإحصاء والمالية والعمليات والموارد البشرية والقانون والأدوات الكمية. بعدها: تدخل بصورة أعمق إلى إدارة الأعمال، فتدرس التمويل واللوجستيات والجدوى والأعمال الدولية والتفاوض. وفي النهاية: تبدأ بالنظر إلى المؤسسة ككل من خلال الاستراتيجية والقرارات والمشروعات والجودة والتسويق ونظم المعلومات والأزمات. بعد التخرج: لا تصبح مديرًا تلقائيًا، بل تبدأ مرحلة جديدة تختار فيها المجال الذي تريد التعمق فيه وتبني خبرتك ومهاراتك داخله. السؤال الحاسم: ليس فقط «هل أحب الاقتصاد؟»، بل «هل أريد أن أفهم كيف تعمل المؤسسات، وأن أتعامل مع المال والبيانات والناس والمشكلات والقرارات في الوقت نفسه؟» إذا كان هذا النوع من التفكير والعمل يثير اهتمامك، فقد تكون كلية الاقتصاد ومسار إدارة الأعمال أقرب إلى ما تبحث عنه.","axes":[{"n":1,"title":"التعريف بالتخصص وهويته العلمية","blocks":[{"type":"p","text":"ستتعلم في هذا المسار كيف تعمل المؤسسات وكيف تتخذ قراراتها."},{"type":"p","text":"لن تكون الإدارة مجرد أوامر وتعليمات، بل ستتعامل مع المال والموظفين والعملاء والعمليات والمعلومات والسوق والمشروعات والمخاطر."},{"type":"p","text":"في السنوات الأولى ستأخذ أساسًا في الاقتصاد والمحاسبة والإدارة والتسويق والإحصاء والرياضيات. ثم تبدأ هذه المعارف بالتجمع حول أسئلة أكثر إدارية: كيف تخطط المؤسسة؟ كيف تمول أعمالها؟ كيف تدير موظفيها؟ كيف تنظم الإنتاج والمواد؟ كيف تدرس مشروعًا قبل تنفيذه؟ كيف تتعامل مع المنافسين والعملاء؟ وكيف تختار بين عدة قرارات ممكنة؟"},{"type":"p","text":"الخلاصة: ستتعلم كيف تفهم المنظمة بوصفها مجموعة أجزاء مترابطة، لا كيف تحفظ مجموعة نظريات إدارية فقط."}]},{"n":2,"title":"موقع التخصص ضمن الخريطة العلمية","blocks":[{"type":"p","text":"ضمن خريطة «دليلك الجامعي» يقع مسار إدارة الأعمال أساسًا ضمن: العلوم الإنسانية والاجتماعية ← الأعمال والإدارة ← إدارة الأعمال."},{"type":"p","text":"لكن دراستك لن تبقى داخل الإدارة وحدها. ستتقاطع مع:"},{"type":"list","items":["الاقتصاد: لفهم السوق والبيئة الاقتصادية.","المحاسبة والتمويل: لفهم المال والتكلفة والنتائج.","الإحصاء والرياضيات: لتحليل البيانات والبدائل.","التسويق: لفهم السوق والعملاء.","القانون: لفهم البيئة النظامية التي تعمل فيها المؤسسة.","الحاسوب ونظم المعلومات: لتنظيم المعلومات واستخدامها في العمل."]},{"type":"p","text":"لذلك ستدرس التخصص من أكثر من زاوية قبل أن تبدأ بالنظر إلى المؤسسة ككل."}]},{"n":3,"title":"طبيعة التخصص","blocks":[{"type":"p","text":"إدارة الأعمال في هذا البرنامج تجمع عدة جوانب:"},{"type":"list","items":["نظري: لأنك ستتعلم مفاهيم ونظريات في الاقتصاد والإدارة والتنظيم والتسويق.","كمي: لأنك ستتعامل مع الرياضيات والإحصاء والمحاسبة والمالية وبحوث العمليات.","تحليلي: لأن كثيرًا من الأسئلة الإدارية لا تحل بالحفظ، بل بجمع المعلومات ومقارنة الخيارات.","تطبيقي: لأن بعض المقررات تنقلك من المفهوم إلى استخدامه في دراسة جدوى أو قرار مالي أو تحليل إحصائي أو تطبيق حاسوبي.","إنساني: لأن المؤسسات تتكون من أشخاص، لذلك ستتعامل أيضًا مع الموارد البشرية والتواصل والتفاوض والعلاقات العامة والعملاء."]},{"type":"p","text":"لا يعني ذلك أنك ستقضي دراستك في تدريب ميداني مستمر؛ الجزء الأكبر أكاديمي جامعي، وتتغير درجة التطبيق بحسب المقرر."}]},{"n":4,"title":"المحتوى العلمي للتخصص","blocks":[{"type":"p","text":"إذا نظرت إلى المقررات كأسماء منفصلة فقد تبدو كثيرة وغير مترابطة. الأفضل أن تراها كمجموعات تبني فهمك للمؤسسة:"},{"type":"p","text":"الاقتصاد:"},{"type":"p","text":"ستتعلم أساسيات الاقتصاد الجزئي والكلي والمالية العامة، حتى تفهم البيئة التي تعمل فيها الشركات والمؤسسات."},{"type":"p","text":"الإدارة:"},{"type":"p","text":"ستبدأ بمبادئ الإدارة، ثم تنتقل إلى الإنتاج والعمليات والموارد البشرية والأعمال الدولية والمنظمات والاستراتيجية والجودة والأزمات."},{"type":"p","text":"المحاسبة والتمويل:"},{"type":"p","text":"ستتعلم كيف تسجل المؤسسة معلوماتها المالية، وكيف تقرأ التكلفة والتمويل والقرارات المالية والأسواق والمؤسسات المالية."},{"type":"p","text":"التسويق:"},{"type":"p","text":"ستدرس أساسيات التسويق، ثم الاتصال التسويقي والتسويق الإلكتروني وإدارة التسويق والعلاقات العامة."},{"type":"p","text":"التحليل الكمي:"},{"type":"p","text":"ستجد الرياضيات والإحصاء والرياضيات الاقتصادية والمالية وبحوث العمليات ونظرية القرارات."},{"type":"p","text":"المعلومات والتقنية:"},{"type":"p","text":"ستتعامل مع المهارات الحاسوبية وتطبيقات الحاسوب في الإدارة ونظم المعلومات الإدارية."},{"type":"p","text":"المشروعات والبحث:"},{"type":"p","text":"ستدرس الجدوى الاقتصادية والمشروعات الصغيرة ومنهجية البحث العلمي."},{"type":"p","text":"هذه الحزم لا تعمل منفصلة؛ في القرار الحقيقي قد تحتاج إلى أكثر من واحدة منها في الوقت نفسه."}]},{"n":5,"title":"الخطة الدراسية ومسار الدراسة","blocks":[{"type":"p","text":"تمتد رحلتك أربع سنوات. ويمكن فهم الانتقال بين مراحلها بهذه الصورة:"},{"type":"table","head":["المرحلة","محور الانتقال","أمثلة من الدراسة"],"rows":[["الأولى والثانية","بناء الأساس","اقتصاد، إدارة، محاسبة، تسويق، حاسوب، رياضيات، إحصاء، قانون، ثم اقتصاد كلي ومالية عامة ورياضيات اقتصادية ومالية وإنتاج وموارد بشرية."],["الثالثة","الدخول إلى إدارة الأعمال","الإدارة المالية، بحوث العمليات، اللوجستيات، الأسواق المالية، دراسة الجدوى، الأعمال الدولية، التفاوض، تطبيقات الحاسوب في الإدارة."],["الرابعة","النظر إلى المنظمة ككل","الإدارة الاستراتيجية، نظرية المنظمة، القرارات، المشروعات الصغيرة، الجودة، التسويق الإلكتروني، الأزمات، العلاقات العامة، نظم المعلومات، المؤسسات المالية، البحث العلمي."]]},{"type":"p","text":"ما الذي يتغير عبر السنوات؟ في البداية تتعلم لغة الاقتصاد والأعمال؛ ثم تبني أدوات كمية وتنظيمية؛ ثم تدخل إلى إدارة الأعمال بصورة أعمق؛ وفي النهاية تبدأ بالنظر إلى المؤسسة ككل وربط قراراتها ووظائفها ببعضها."}]},{"n":6,"title":"أساليب التعلم والتدريب","blocks":[{"type":"p","text":"لن تتعلم جميع المواد بالطريقة نفسها."},{"type":"list","items":["المقررات النظرية: ستحتاج فيها إلى قراءة وفهم المفاهيم والنظريات.","المقررات الكمية: ستحتاج إلى حل مسائل وتمرين متكرر، خصوصًا في الرياضيات والإحصاء والمحاسبة والمالية وبحوث العمليات.","الحاسوب ونظم المعلومات: ستستخدم أدوات رقمية إلى جانب الفهم النظري.","دراسة الجدوى والقرارات والبحث العلمي: تدفعك إلى تحويل المعلومات إلى تحليل منظم بدل الاكتفاء بحفظ التعاريف."]},{"type":"p","text":"لهذا قد تكتشف أن طريقة الدراسة الناجحة في مادة نظرية لا تكفي في مادة كمية، والعكس صحيح."}]},{"n":7,"title":"طبيعة التفكير في التخصص","blocks":[{"type":"p","text":"التفكير الإداري لا يبدأ بالسؤال: «ما الجواب المحفوظ؟» بل غالبًا بالسؤال: «ما المشكلة أصلًا؟»"},{"type":"p","text":"ثم تبدأ أسئلة أخرى: ما المعلومات التي أحتاج إليها؟ ما الخيارات المتاحة؟ ما تكلفة كل خيار؟ ما المخاطر؟ ماذا سيحدث للموظفين والعملاء والمال والعمليات؟ وأي قرار يحقق الهدف بصورة أفضل؟"},{"type":"p","text":"نمط تفكير متكرر: تحدد المشكلة ← تجمع المعلومات ← تحللها ← تضع بدائل ← تقارنها ← تختار ← تراقب النتيجة وتعيد التقييم."},{"type":"p","text":"ولهذا ستحتاج إلى الجمع بين الأرقام والمنطق وفهم الناس والسياق."}]},{"n":8,"title":"المعارف والمهارات والكفاءات المكتسبة","blocks":[{"type":"p","text":"المعارف:"},{"type":"p","text":"ستبني أساسًا في الإدارة والاقتصاد والمحاسبة والتمويل والتسويق والإحصاء والعمليات والقانون ونظم المعلومات."},{"type":"p","text":"المهارات:"},{"type":"p","text":"مع التقدم في الدراسة ستتدرب على تحليل بيانات ومعلومات، وتحليل مسائل مالية وإدارية، ومقارنة البدائل، واستخدام بعض الأدوات الرقمية، والبحث والتواصل والتفاوض."},{"type":"p","text":"الكفاءات:"},{"type":"p","text":"تظهر الكفاءة عندما تستطيع استخدام أكثر من نوع من المعرفة في مشكلة واحدة. فإذا أردت تقييم مشروع جديد مثلًا، قد تحتاج إلى فهم السوق والتكلفة والتمويل والعمليات والمخاطر والموارد البشرية معًا."},{"type":"p","text":"وهنا تنتقل من معرفة كل مادة منفردة إلى القدرة على رؤية المؤسسة بصورة متكاملة."}]},{"n":9,"title":"التطبيقات العملية للمعرفة المكتسبة","blocks":[{"type":"list","items":["المحاسبة والمالية: تساعدانك على فهم ما يحدث ماليًا داخل المؤسسة.","التسويق: يساعدك على فهم السوق والعملاء والمنافسة وطريقة الوصول إليهم.","الإحصاء والأدوات الكمية: تجعل القرار أقل اعتمادًا على الانطباع وأكثر اعتمادًا على المعلومات.","إدارة العمليات واللوجستيات: تساعدك على فهم كيف تتحرك الموارد والمواد والعمل داخل المؤسسة.","دراسة الجدوى: تساعدك على تقييم مشروع قبل استثمار الموارد فيه.","الموارد البشرية: تساعدك على فهم جانب الأفراد والعمل والتنظيم.","الإدارة الاستراتيجية: تجمع هذه العناصر في أسئلة أوسع عن موقع المؤسسة واتجاهها ومواردها وقراراتها."]}]},{"n":10,"title":"الحياة الجامعية في التخصص","blocks":[{"type":"p","text":"قد تدخل الكلية معتقدًا أن معظم الدراسة ستكون قراءة وحفظًا. لكن ستكتشف سريعًا أن طبيعة المواد مختلفة."},{"type":"p","text":"في مادة قد تدرس نظرية أو مفهومًا اقتصاديًا. وفي مادة أخرى تجلس أمام مسائل إحصائية أو محاسبية. ثم تنتقل إلى مقرر إداري يحتاج إلى تحليل مشكلة أو مقارنة خيارات."},{"type":"p","text":"هذا التنوع يعني أن تنظيم الدراسة مهم؛ لأن ترك مادة كمية حتى الأيام الأخيرة يختلف تمامًا عن مراجعة مادة نظرية."},{"type":"p","text":"كما ستلاحظ أن العلاقة بين المواد تصبح أوضح مع الوقت. ما تعلمته في المحاسبة والإحصاء والاقتصاد في البداية سيعود لاحقًا عندما تدرس المالية والجدوى والقرارات والاستراتيجية."}]},{"n":11,"title":"المسار المهني لخريج التخصص","blocks":[{"type":"p","text":"بعد التخرج لن تكون محصورًا في وظيفة واحدة، لكنك أيضًا لن تصبح «مديرًا عامًا» بمجرد الحصول على الشهادة."},{"type":"p","text":"قد تبدأ في أعمال مرتبطة بـ:"},{"type":"list","items":["الإدارة والعمليات.","المشروعات.","الموارد البشرية.","المبيعات والتسويق.","المشتريات واللوجستيات.","الإدارة المكتبية.","التحليل الإداري.","بعض الأعمال المالية والمحاسبية المساندة.","نظم المعلومات والأعمال الرقمية."]},{"type":"p","text":"ويختلف المسار الفعلي بحسب القطاع الذي تعمل فيه والمهارات التي تبنيها والخبرة التي تكتسبها."},{"type":"p","text":"بعض المهن المتخصصة قد تحتاج إلى مؤهلات أو شروط إضافية، لذلك لا تفترض أن الشهادة تمنحك تلقائيًا كل صفة مهنية مرتبطة بالاقتصاد أو المحاسبة أو التمويل."}]},{"n":12,"title":"واقع التخصص في سوق العمل","blocks":[{"type":"p","text":"من أكثر الجمل التي يجب أن تحذر منها: «التخصص مطلوب جدًا». لا يوجد سوق عمل بهذه البساطة."},{"type":"p","text":"توجد في السوق السوري الحالي فرص تعلن عن إدارة الأعمال والاقتصاد ضمن المؤهلات المقبولة، كما تظهر وظائف في المشروعات والإدارة المكتبية والقيادة والمالية والمحاسبة والعمليات."},{"type":"p","text":"لكن بيانات الوظائف المتاحة لا تغطي كل السوق، وجزء كبير من الفرص المنشورة حاليًا مرتبط بالمنظمات والمؤسسات العامة وبرامج التعافي."},{"type":"p","text":"لذلك لا تبن قرارك على عبارة «الاقتصاد مطلوب». اسأل بدلًا منها:"},{"type":"list","items":["ما الوظيفة التي أريدها؟","ما المهارات التي تتطلبها؟","ما القطاع الذي أريد الدخول إليه؟","ما الأدوات التي أحتاج إلى تعلمها إضافة إلى الشهادة؟","وأين توجد الفرص فعلًا عند تخرجي؟"]},{"type":"p","text":"الشهادة تفتح بابًا، لكنها لا تلغي المنافسة."}]},{"n":13,"title":"المسارات بعد التخرج والتطور المهني","blocks":[{"type":"p","text":"يمكنك بعد الإجازة أن تبدأ العمل ثم تتخصص تدريجيًا."},{"type":"p","text":"قد تجعل الموارد البشرية مجالك الأساسي، أو التسويق، أو الإدارة المالية، أو المشروعات، أو العمليات واللوجستيات، أو الأعمال الرقمية ونظم المعلومات."},{"type":"p","text":"كما يمكنك متابعة الدراسات العليا في إدارة الأعمال أو المجالات المرتبطة بها وفق البرامج والشروط المتاحة عند تخرجك. ومع الدراسات العليا والبحث يمكن أن تتجه لاحقًا إلى المسار الأكاديمي."},{"type":"p","text":"ليس هناك طريق واحد يجب أن يسلكه جميع الخريجين؛ قيمة السنوات الأولى بعد الجامعة ستكون في اكتشاف المجال الذي تريد أن تتحول فيه من معرفة عامة إلى خبرة أعمق."}]},{"n":14,"title":"مستقبل التخصص وتطوراته","blocks":[{"type":"p","text":"من أكبر التغيرات التي ستؤثر في مجال الأعمال خلال السنوات القادمة استخدام البيانات والتقنيات الرقمية والذكاء الاصطناعي."},{"type":"p","text":"قد تستخدم أدوات ذكية في تحليل المعلومات، وإعداد التقارير، والتسويق، وخدمة العملاء، والتوقع ودعم القرار."},{"type":"p","text":"وهذا لا يجعل معرفة الإدارة أقل أهمية؛ بل يغير نوع المهارات المطلوبة. سيزداد احتياجك إلى أن تعرف:"},{"type":"list","items":["هل البيانات صحيحة؟","هل التحليل منطقي؟","هل الأداة فهمت المشكلة أصلًا؟","ما القرار الذي يمكن تطبيقه فعلًا؟","وما أثره في الموظفين والعملاء والمؤسسة؟"]},{"type":"p","text":"لذلك لن يكون كافيًا أن تعرف استخدام برنامج أو أداة واحدة. ستحتاج إلى التفكير النقدي والتواصل والتحليل والمرونة والقدرة على تعلم أدوات جديدة."}]},{"n":15,"title":"مميزات التخصص","blocks":[{"type":"list","items":["صورة واسعة عن المؤسسة: لن ترى الشركة من زاوية المال فقط أو التسويق فقط أو الموظفين فقط؛ بل ستتعلم كيف ترتبط هذه العناصر ببعضها.","تعدد المسارات: يفتح المجال أمامك أكثر من اتجاه مهني، ويمكنك خلال الجامعة اكتشاف الجانب الذي يناسبك أكثر.","الجمع بين الكمي والإنساني: ستتعامل مع الأرقام والبيانات، ومع الناس والتواصل والتنظيم في الوقت نفسه.","فائدة لريادة الأعمال: إذا فكرت مستقبلًا في مشروعك الخاص، ستفهم أن نجاحه لا يعتمد على جودة المنتج فقط، بل على المال والتسويق والعمليات والأشخاص والقرار."]},{"type":"p","text":"لكن هذه المميزات لا تعني أن النجاح أو الوظيفة أو الدخل مضمون."}]},{"n":16,"title":"تحديات التخصص","blocks":[{"type":"list","items":["اتساع المجال: يمكن أن تعرف القليل عن مجالات كثيرة، ثم تكتشف بعد التخرج أنك تحتاج إلى التعمق في مجال واحد حتى تتميز.","الجانب الكمي: الدراسة ليست خالية من الأرقام؛ ستجد الرياضيات والإحصاء والمحاسبة والمالية وبحوث العمليات.","المنافسة: الوظائف المرتبطة بالأعمال يشاركك فيها خريجون من تخصصات أخرى، لذلك قد تصبح المهارة والخبرة أهم من اسم الشهادة وحده.","تغير الأدوات: ستحتاج إلى متابعة تغير الأدوات الرقمية وأساليب العمل باستمرار."]},{"type":"p","text":"تعامل مع الجامعة كأساس تبني فوقه، لا كآخر مرحلة في تعلمك."}]},{"n":17,"title":"مؤشرات ملاءمة التخصص للطالب","blocks":[{"type":"p","text":"قد تنسجم أكثر مع التخصص إذا كنت:"},{"type":"list","items":["تهتم بفهم كيف تعمل الشركات والمؤسسات.","تستمتع بحل مشكلات لها أكثر من خيار.","لا تمانع التعامل مع الأرقام إلى جانب التعامل مع الناس.","تحب المقارنة والتحليل واتخاذ القرار.","لديك استعداد للتواصل والتفاوض والعمل ضمن بيئة فيها آراء ومصالح مختلفة.","تستطيع رؤية الصورة العامة من دون إهمال التفاصيل.","لديك استعداد لأن تختار لاحقًا مجالًا تتعمق فيه."]},{"type":"p","text":"ولا يعني غياب إحدى هذه الصفات أن التخصص غير مناسب لك؛ كثير منها يمكن تطويره بالتدريب والخبرة."}]},{"n":18,"title":"الجوانب غير الظاهرة في التخصص","blocks":[{"type":"list","items":["المسار المفتوح حاليًا: من أهم ما قد لا يظهر من اسم «كلية الاقتصاد» أن المسار المفتوح حاليًا في جامعة حمص هو إدارة الأعمال.","ليس تخصصًا أدبيًا خالصًا: ستتعامل أيضًا مع الرياضيات والإحصاء والمحاسبة والمالية.","الإدارة ليست إعطاء أوامر: كثير من العمل الإداري هو جمع معلومات، ومتابعة تفاصيل، وتحليل مشكلات، وتنسيق بين أشخاص، وكتابة تقارير واتخاذ قرارات.","الهوية المهنية تُبنى مع الوقت: التخصص واسع، لذلك ستحتاج غالبًا إلى إضافة مجال أو أدوات واضحة إلى أساسك الإداري."]},{"type":"p","text":"قد تتخذ هذه الهوية مثلًا صورة: إدارة + موارد بشرية، أو إدارة + بيانات، أو إدارة + مالية، أو إدارة + تسويق، أو إدارة + تقنية؛ بحسب المجال الذي تختاره."}]},{"n":19,"title":"التصورات الخاطئة حول التخصص","blocks":[{"type":"p","text":"«الاقتصاد يعني البنوك والدولار والبورصة فقط.» الأدق: ستتعلم أساسيات اقتصادية، لكن البرنامج يمتد إلى الإدارة والمحاسبة والتمويل والتسويق والإحصاء والعمليات ونظم المعلومات."},{"type":"p","text":"«إدارة الأعمال كلها حفظ.» الأدق: يوجد جانب نظري، لكنك ستتعامل أيضًا مع الرياضيات والإحصاء والمحاسبة والمالية وبحوث العمليات والقرارات."},{"type":"p","text":"«بعد أربع سنوات سأصبح مديرًا.» الأدق: ستتخرج بأساس إداري، أما المسؤوليات القيادية فتبنى مع الخبرة والنتائج."},{"type":"p","text":"«بما أن المجال واسع، فأستطيع العمل في أي شيء.» الأدق: الاتساع يمنحك خيارات، لكن كل وظيفة تحتاج إلى مجموعة مهارات محددة."},{"type":"p","text":"«وجود فرص لإدارة الأعمال يعني أن وظيفتي مضمونة.» الأدق: السوق يتغير، والمنافسة موجودة، والفرصة تتأثر بمهاراتك وخبرتك والقطاع ومكان العمل والظروف الاقتصادية."},{"type":"p","text":"«الذكاء الاصطناعي سيجعل دراسة الإدارة بلا فائدة.» الأدق: التقنية ستغير كثيرًا من المهام، ولذلك ستزداد أهمية أن تستطيع فهم المشكلة وتقييم البيانات والنتائج واتخاذ قرار مسؤول."}]},{"n":20,"title":"أثر التخصص وتطبيقاته وعلاقاته","blocks":[{"type":"p","text":"كل مؤسسة، مهما كان مجالها، تحتاج إلى اتخاذ قرارات حول المال والأشخاص والوقت والمعلومات والعمليات والعملاء. وهنا يظهر أثر الإدارة."},{"type":"p","text":"في شركة صناعية قد تعمل على الإنتاج والتكلفة والمخزون والموارد البشرية. وفي مؤسسة خدمية قد تركز أكثر على العملاء والجودة والعمليات. وفي مشروع صغير قد تحتاج إلى فهم التسويق والتمويل والتكاليف والمبيعات في الوقت نفسه. وفي منظمة أو مؤسسة عامة قد يظهر دور الإدارة في المشروعات والموارد والمتابعة والتخطيط."},{"type":"p","text":"لذلك يرتبط التخصص مباشرة بالاقتصاد والمحاسبة والتمويل والتسويق والإحصاء والقانون والحاسوب ونظم المعلومات."},{"type":"p","text":"وفي بيئة تحتاج إلى إعادة تشغيل الأعمال وتحسين المؤسسات وتطوير المشروعات وخلق الوظائف، تصبح جودة الإدارة عاملًا مهمًا، لكنها تبقى جزءًا من منظومة اقتصادية أوسع."}]}],"sources":[],"updated":"2026-08"},"tourism":{"slug":"tourism","name":"السياحة","hero":"tourism","cluster":{"key":"civil","name":"الهندسة المدنية","color":"#E75503"},"card":{"years":4,"faculty":"كلية السياحة - جامعة حمص","study_nature":"إدارية واقتصادية وإنسانية وتسويقية وخدمية وتقنية · مع جانب تطبيقي","field":"العلوم الإنسانية والاجتماعية، مع تقاطع قوي مع الأعمال والإدارة والتراث واللغات والتكنولوجيا"},"intro":"قد تسمع كلمة «السياحة» فتتخيل السفر والرحلات والفنادق وزيارة الأماكن الجميلة. لكن هذه صورة ناقصة. عندما تدرس السياحة، لن تكون مهمتك أن تعرف أين يسافر الناس فقط؛ بل ستتعلم كيف تعمل صناعة كاملة حول الزائر والوجهة: كيف تُخطط السياحة، وكيف تُدار الخدمات، وكيف تُسوَّق المدن والمواقع، وكيف تعمل شركات السياحة ووكالات السفر، وكيف تؤثر السياحة في الاقتصاد والمجتمع والبيئة. ستكتشف أن التخصص يجمع مجالات قد تبدو متباعدة: الإدارة والاقتصاد والتسويق واللغات والتاريخ والآثار والجغرافيا والتكنولوجيا والتواصل. ولهذا فإن السؤال الأهم قبل اختيار السياحة ليس «هل أحب السفر؟» فقط، بل «هل أريد أن أفهم كيف تُبنى التجربة السياحية وكيف تُدار وتُسوَّق وتُطوَّر؟» قبل أن تعتمد على أي تفصيل: قد تتغير الخطة الدراسية والأنظمة مع الوقت؛ لذلك استخدم هذا الدليل لفهم التخصص، ثم راجع كلية السياحة مباشرة قبل التسجيل.","summary":"في البداية: تبني أساسًا في اللغات والحاسوب والاقتصاد والإدارة والإحصاء. ثم: تقترب من السياحة نفسها عبر التسويق والتاريخ والمواقع والجغرافيا والإرشاد والخدمات. بعد ذلك: تتعلم كيف تحلل الوجهات وتخطط للسياحة وتتعامل مع الاستدامة وشركات السفر والمشروعات. وفي النهاية: تدخل إلى الإدارة الاستراتيجية والترويج والتشريعات والجودة وإدارة الأزمات والبحث، ثم تنجز مشروع التخرج. بعد التخرج: تبدأ بناء المسار الذي يناسبك داخل قطاع واسع ومتغير، ولا تنتهي حاجتك إلى تطوير اللغات والتكنولوجيا والتواصل. السؤال الحاسم: ليس فقط «هل أحب السفر والسياحة؟» بل: «هل أريد أن أقضي سنواتي أتعلم كيف أفهم الزائر والمكان والسوق، وكيف أخطط وأسوق وأنظم وأتواصل، ثم أحوّل كل ذلك إلى تجربة أو خدمة سياحية حقيقية؟»","axes":[{"n":1,"title":"التعريف بالتخصص وهويته العلمية","blocks":[{"type":"p","text":"السياحة ليست السفر نفسه، بل المجال الذي يدرس الزوار والوجهات والخدمات والمنشآت والأنشطة التي تشكل التجربة السياحية، وكيفية إدارتها وتطويرها وتسويقها. ستتعامل مع أسئلة مثل: لماذا يزور الناس مكانًا معينًا؟ من الزائر الذي تستهدفه؟ ما الذي يحتاجه؟ كيف يمكن تطوير المكان دون الإضرار به؟ وكيف تعمل الشركات والمؤسسات التي تقف خلف هذه التجربة؟"},{"type":"p","text":"لذلك ستجد أن السياحة ليست مادة واحدة، بل منظومة تجمع بين الإدارة والاقتصاد والتسويق والثقافة والتاريخ واللغة والتكنولوجيا."},{"type":"p","text":"الخلاصة: لن تدرس «السفر» فقط؛ ستدرس كيف تتحول الوجهة والخدمة والمعلومة والتواصل إلى تجربة سياحية قابلة للتخطيط والإدارة والتطوير."}]},{"n":2,"title":"موقع التخصص ضمن الخريطة العلمية","blocks":[{"type":"p","text":"السياحة تخصص عابر لحدود مجال واحد. في خريطة «دليلك الجامعي» يمكن فهمه ضمن العلوم الإنسانية والاجتماعية، مع تقاطع واضح مع الأعمال والإدارة. أما في التصنيف التعليمي الدولي فيقع السفر والسياحة والترفيه ضمن مجال الخدمات."},{"type":"p","text":"ويرتبط التخصص مباشرة بعدة مجالات:"},{"type":"list","items":["الاقتصاد والإدارة: لفهم السوق والمنشآت والموارد والمشروعات.","التسويق: لفهم الزائر وبناء العروض والحملات والترويج للوجهات.","التاريخ والآثار: لفهم المواقع والتراث وتحويل المعرفة بها إلى منتجات وتجارب مسؤولة.","الجغرافيا: لفهم المكان والموارد والحركة والوجهات.","اللغات والتواصل: للتعامل مع الزوار والأسواق المختلفة.","البيئة: لفهم الاستدامة وآثار السياحة على الموارد والمجتمعات.","تقنية المعلومات: للحجز والتسويق والأعمال الإلكترونية وتحليل البيانات."]}]},{"n":3,"title":"طبيعة التخصص","blocks":[{"type":"list","items":["إداري: لأنك ستدرس الإدارة وتنظيم المنشآت والموارد البشرية والاستراتيجية.","اقتصادي: لأنك ستتعامل مع الاقتصاد والمحاسبة ودراسة الجدوى والعلاقات الاقتصادية.","تسويقي: لأن الوجهة أو الخدمة لا تكفي وحدها؛ يجب أن تعرف لمن تقدمها وكيف تصل إليه.","إنساني وثقافي: لأن السياحة ترتبط بالناس واللغات والتاريخ والتراث والثقافات المختلفة.","تقني: لأن التكنولوجيا تدخل في المعلومات والحجز والتسويق والخدمات والأعمال الإلكترونية.","تطبيقي: لأن المعرفة تُستخدم في تحليل وجهة أو خدمة، وبناء برنامج أو حملة، ودراسة مشروع واتخاذ قرار."]},{"type":"p","text":"لهذا لن تستطيع اختزال التخصص بكلمة واحدة مثل «نظري» أو «عملي»؛ فطبيعته تأتي من جمع هذه الجوانب داخل مشكلة سياحية واحدة."}]},{"n":4,"title":"المحتوى العلمي للتخصص","blocks":[{"type":"p","text":"بدل أن ترى عشرات أسماء المقررات، يمكنك فهم ما ستدرسه من خلال مجموعات رئيسية:"},{"type":"list","items":["الإدارة والاقتصاد: الاقتصاد والإحصاء والإدارة والمحاسبة والموارد البشرية ودراسة المشروعات والإدارة الاستراتيجية.","السياحة والتخطيط: الصناعة السياحية والسياحة الداخلية والخارجية والتنمية والتخطيط السياحي والسياحة المستدامة وإدارة الأزمات.","التسويق والتواصل: التسويق والتسويق السياحي والترويج والعلاقات العامة والتفاوض والتواصل.","التاريخ والتراث والمكان: تاريخ سورية والمواقع الأثرية والجغرافيا السياحية والمتاحف وبعض موضوعات اللغات القديمة.","شركات السياحة والخدمات: الإرشاد السياحي وشركات السياحة ووكالات السفر وتنظيم المنشآت وجودة الخدمات.","التكنولوجيا: المهارات الحاسوبية وتكنولوجيا المعلومات والأعمال الإلكترونية.","البحث: منهجية البحث العلمي ومشروع التخرج في المرحلة النهائية."]}]},{"n":5,"title":"الخطة الدراسية ومسار الدراسة","blocks":[{"type":"p","text":"تمتد الدراسة في البرنامج على أربع سنوات. ويمكن فهم رحلة الدراسة بهذه الصورة:"},{"type":"table","head":["السنة","محور الانتقال","أمثلة من الخطة"],"rows":[["الأولى","بناء الأساس","لغات، حاسوب، اقتصاد، إحصاء، إدارة، محاسبة، واقتصاديات الصناعة السياحية."],["الثانية","الاقتراب من القطاع","تكنولوجيا المعلومات، تسويق، موارد بشرية، تاريخ سورية، مواقع أثرية، إرشاد وجغرافيا سياحية."],["الثالثة","التخصص السياحي","تسويق سياحي، سياحة داخلية وخارجية، تخطيط وتنمية، متاحف، سياحة مستدامة، وشركات سياحة وسفر."],["الرابعة","الإدارة والتطوير","إدارة أزمات، ترويج، أعمال إلكترونية، تشريعات، إدارة استراتيجية، جودة خدمات، بحث ومشروع تخرج."]]},{"type":"p","text":"ما الذي يتغير عبر السنوات؟: في البداية تبني قاعدة إدارية واقتصادية ولغوية؛ ثم تقترب من قطاع السياحة وموارده وخدماته؛ وبعدها تدخل إلى التخطيط والتسويق وشركات السفر والاستدامة؛ وفي النهاية تجمع الإدارة والجودة والتشريعات والبحث في مستوى أكثر تكاملًا."}]},{"n":6,"title":"أساليب التعلم والتدريب","blocks":[{"type":"p","text":"لن تعتمد طوال دراستك على طريقة تعلم واحدة. ستختلف الطريقة بحسب طبيعة المادة:"},{"type":"list","items":["اللغات: تحتاج إلى ممارسة مستمرة، لا إلى دراسة نظرية فقط.","الاقتصاد والإحصاء والمحاسبة: تحتاج إلى فهم العلاقات والبيانات وتحليلها.","التاريخ والمواقع والجغرافيا: تحتاج إلى بناء صورة عن المكان وسياقه وربط المعلومات بالوجهة.","التسويق والإدارة والتخطيط: تحتاج إلى تطبيق المفاهيم على مشكلات وقرارات واقعية.","الجانب العملي: يظهر في بعض التقييمات العملية وفي استخدام المهارات والأدوات المرتبطة بالمقررات.","مشروع التخرج: يجمع في السنة الرابعة جانبًا من المعرفة والبحث والتحليل في عمل متكامل."]},{"type":"p","text":"كلما استطعت ربط المادة بقطاع السياحة الحقيقي، أصبح فهمك أعمق من مجرد النجاح في الامتحان."}]},{"n":7,"title":"طبيعة التفكير في التخصص","blocks":[{"type":"p","text":"تخيل أنك تريد تطوير منطقة لتصبح وجهة سياحية أفضل. لن يكون السؤال «هل المكان جميل؟» فقط. ستحتاج إلى معرفة من سيزوره، ولماذا سيأتي، وكيف سيصل، وما الخدمات الموجودة، وما الذي ينقصه، وما تكلفة التطوير، وكيف ستسوّقه، وكيف ستحافظ على المكان، وماذا ستفعل إذا حدثت أزمة."},{"type":"p","text":"هكذا يعمل التفكير في السياحة: تجمع المعلومات، ثم تحللها، وتقارن البدائل، وتفكر في الزائر والمكان والاقتصاد والخدمة، ثم تبني قرارًا."},{"type":"list","items":["الفهم والتحليل.","البحث وجمع المعلومات.","المقارنة والتقييم.","التخطيط.","التواصل.","حل المشكلات واتخاذ القرار."]}]},{"n":8,"title":"المعارف والمهارات والكفاءات المكتسبة","blocks":[{"type":"p","text":"المعارف:"},{"type":"list","items":["السياحة والوجهات والخدمات.","الإدارة والاقتصاد والتسويق.","التراث والمواقع والجغرافيا السياحية.","التخطيط والتشريعات والجودة والاستدامة.","شركات السياحة والسفر والتكنولوجيا السياحية."]},{"type":"p","text":"المهارات:"},{"type":"list","items":["البحث وجمع المعلومات وتحليلها.","التواصل واستخدام اللغات.","التسويق وبناء الأفكار الترويجية.","التخطيط ودراسة المشروعات.","استخدام الأدوات الرقمية وعرض الأفكار وتنظيمها."]},{"type":"p","text":"الكفاءات:"},{"type":"p","text":"تظهر كفاءتك عندما تستطيع جمع هذه المعارف والمهارات في موقف واحد؛ مثل أن تفهم وجهة سياحية، وتحدد جمهورها، وتدرس نقاط قوتها ومشكلاتها، وتقترح طريقة لتطويرها وتسويقها بدل التعامل مع كل عنصر بصورة منفصلة."}]},{"n":9,"title":"التطبيقات العملية للمعرفة المكتسبة","blocks":[{"type":"list","items":["التسويق: تستخدمه في الترويج لوجهة أو خدمة أو برنامج سياحي.","التخطيط: يساعدك على فهم كيفية تطوير المنطقة السياحية وتنظيم نشاطها.","دراسة الجدوى: تساعدك على تقييم المشروع قبل اتخاذ قرار الاستثمار.","التاريخ والمواقع والجغرافيا: تدعم بناء المنتجات والمسارات السياحية ذات المعنى.","شركات السياحة والسفر: ترتبط بتنظيم الرحلات والخدمات والتواصل مع الزوار ومقدمي الخدمة.","إدارة الأزمات: تساعدك على التفكير في الاستجابة عندما تتعرض الوجهة أو المؤسسة لظرف مفاجئ.","الجودة والعلاقات العامة: تساعدان على تحسين الخدمة والتواصل مع الزائر والمحافظة على صورة المؤسسة."]},{"type":"p","text":"الفكرة الأساسية: لا تدرس المقرر لتنجح فيه فقط؛ بل لتعرف ماذا تستطيع أن تفعل بالمعرفة بعد ذلك."}]},{"n":10,"title":"الحياة الجامعية في التخصص","blocks":[{"type":"p","text":"قد تتفاجأ بتنوع المواد أكثر من صعوبتها. في الفترة نفسها قد تدرس لغة واقتصادًا وتاريخًا وتسويقًا وسياحة وحاسوبًا، وهذا يعني أنك ستحتاج إلى تغيير طريقة دراستك من مادة إلى أخرى."},{"type":"p","text":"ومع تقدمك في السنوات تقل المواد العامة نسبيًا، وتزداد المواد التي تدخل في صلب السياحة والتخطيط والتسويق وشركات السفر وإدارة الخدمات. كما ستواجه امتحانات، ومنها تقييمات عملية في بعض المقررات، وفي السنة الرابعة يصبح مشروع التخرج جزءًا مهمًا من المرحلة النهائية."},{"type":"list","items":["ابدأ ببناء لغتك من السنوات الأولى؛ فهي أداة مهنية وليست مجرد مقرر.","طوّر مهاراتك الرقمية بالتوازي مع الدراسة؛ لأن القطاع يعتمد بصورة متزايدة على المنصات والأعمال الإلكترونية.","حاول ربط المعلومات بالمواقع والخدمات والشركات الحقيقية بدل إبقائها منفصلة في دفاتر المقررات."]}]},{"n":11,"title":"المسار المهني لخريج التخصص","blocks":[{"type":"p","text":"لن تكون محصورًا بعد التخرج في وظيفة واحدة تحمل اسم «موظف سياحة». قد تجد مسارك في مجالات مختلفة داخل القطاع، مثل:"},{"type":"list","items":["شركات السياحة والسفر وتنظيم البرامج والرحلات.","التسويق والترويج السياحي والعلاقات العامة.","تنظيم الفعاليات والمعارض والمؤتمرات.","إدارة وتطوير الخدمات والوجهات السياحية.","دراسة المشروعات والتخطيط والتنمية السياحية.","السياحة الثقافية والتراثية وجودة الخدمات.","البحث والعمل الأكاديمي بعد استكمال المؤهلات المطلوبة."]},{"type":"p","text":"لكن انتبه إلى الفرق بين دراسة مجال وبين الحصول على ترخيص مهني. فوجود الإرشاد السياحي في دراستك لا يعني أنك أصبحت بعد التخرج مباشرة دليلًا سياحيًا مرخصًا؛ فممارسة الدلالة السياحية لها متطلبات تأهيل وترخيص مستقلة."}]},{"n":12,"title":"واقع التخصص في سوق العمل","blocks":[{"type":"p","text":"القطاع السياحي السوري يمر حاليًا بمرحلة تغير ونشاط مقارنة بسنوات سابقة، وتظهر حركة زوار ومشروعات ومنشآت ومسارات سياحية جديدة، ومنها نشاطات في حمص والمناطق المحيطة."},{"type":"p","text":"لكن لا تخلط بين «القطاع ينمو» و«وظيفتي مضمونة». الفرصة التي تحصل عليها ستعتمد أيضًا على لغاتك، ومهاراتك الرقمية، وقدرتك على التواصل، وخبرتك، والمجال الذي تختاره، ومكان إقامتك، ووضع الشركات والاستثمارات والاقتصاد."},{"type":"p","text":"لا تبنِ قرارك على عبارة «السياحة ستنتعش» وحدها. اسأل أيضًا: ما المهارات التي سأبنيها حتى أكون قادرًا على المنافسة داخل هذا القطاع؟"}]},{"n":13,"title":"المسارات بعد التخرج والتطور المهني","blocks":[{"type":"p","text":"بعد التخرج تستطيع أن تبدأ بالعمل وبناء الخبرة، ثم تتخصص تدريجيًا في مجال أقرب إلى ميولك وطبيعة السوق."},{"type":"list","items":["التسويق السياحي.","شركات السفر وإدارة الرحلات.","إدارة الوجهات.","السياحة المستدامة.","تنظيم الفعاليات.","جودة الخدمات.","السياحة الثقافية والتراثية.","التكنولوجيا السياحية والأعمال الإلكترونية."]},{"type":"p","text":"كما يمكنك متابعة الدراسات العليا والاتجاه إلى البحث والأكاديميا وفق شروط البرامج المتاحة في ذلك الوقت. شهادة الإجازة ليست نهاية تعلمك؛ فالقطاع نفسه يتغير، والأدوات والتقنيات وسلوك الزوار تتغير معه."}]},{"n":14,"title":"مستقبل التخصص وتطوراته","blocks":[{"type":"list","items":["التحول الرقمي: البحث والحجز والدفع والتواصل والتقييم والتسويق أصبحت مرتبطة بصورة أكبر بالمنصات الرقمية.","الذكاء الاصطناعي: قد يدخل في خدمة العملاء وتحليل البيانات والتوصيات والتسويق وإعداد المحتوى، مع بقاء الحاجة إلى التحقق والحكم البشري.","تحليل البيانات: يساعد المؤسسات والوجهات على فهم الزوار والطلب وتوقيت الحركة وقياس الأداء.","الاستدامة: يزداد الاهتمام بإدارة أثر الزوار على البيئة والموارد والمجتمع المحلي بدل التركيز على زيادة الأعداد فقط.","المرونة وإدارة الأزمات: ستبقى مهمة في قطاع يتأثر بسرعة بالأحداث والنقل والاقتصاد والظروف الدولية والمحلية."]},{"type":"p","text":"المستقبل الأقرب ليس أن «التقنية ستلغي السياحة»، بل أن طريقة العمل ستصبح أكثر رقمية، وستزداد قيمة من يجمع المعرفة السياحية مع اللغة والتواصل والتحليل والمهارات التقنية."}]},{"n":15,"title":"مميزات التخصص","blocks":[{"type":"list","items":["سيجمع لك بين أكثر من مجال بدل أن يحصرك في موضوع واحد ضيق.","ستستخدم اللغات بصورة ذات معنى مهني مباشر.","ستجد مسارات متعددة من الشركات والسفر إلى التسويق والتخطيط والفعاليات والبحث.","ستتعامل مع الناس والأماكن والثقافات والاقتصاد في الوقت نفسه.","يمكن أن ترى أثر الأفكار التسويقية أو التخطيطية في وجهة أو خدمة حقيقية.","ستصبح للمهارات الرقمية قيمة متزايدة داخل المجال.","يمكنك متابعة الدراسات العليا والتخصص في مجالات أكثر دقة."]},{"type":"p","text":"هذه المميزات ناتجة من طبيعة الدراسة والعمل، لكنها لا تعني أن الوظيفة أو الدخل أو النجاح يأتي تلقائيًا مع الشهادة."}]},{"n":16,"title":"تحديات التخصص","blocks":[{"type":"list","items":["اتساع المعرفة: إذا دخلت لأنك تحب التاريخ فقط ستجد اقتصادًا وإحصاءً ومحاسبة وإدارة وتسويقًا، والعكس صحيح.","اللغات والتواصل: يمكن أن تصبحا عاملًا حاسمًا في قدرتك على التعامل مع الزوار والأسواق وبناء مسارك المهني.","حساسية القطاع: السياحة تتأثر بسرعة بالأزمات والاقتصاد والنقل والاستثمار وتغير سلوك الزوار.
